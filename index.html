<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sailor Piece Idle — Play & Wiki</title>
  <meta name="description" content="An incremental fan game inspired by Sailor Piece. Collect Devil Fruits, hire crew, fight bosses, sail through three Seas." />
  <meta name="theme-color" content="#04091a" />
  <meta property="og:title" content="Sailor Piece Idle" />
  <meta property="og:description" content="Idle/incremental fan game and wiki for Sailor Piece." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23f5c542'/><text x='50%25' y='56%25' text-anchor='middle' font-family='Georgia' font-weight='700' font-size='28' fill='%231a1206'>SP</text></svg>" />
</head>
<body data-page="home">

  <main class="game">
    <div class="container">

      <!-- Resource bar -->
      <section class="game-topbar">
        <div class="resource beli">
          <span class="label">Beli</span>
          <span class="value" id="ui-beli">0</span>
          <span class="rate" id="ui-bps">+0/s</span>
        </div>
        <div class="resource">
          <span class="label">Lvl <span id="ui-level">1</span></span>
          <div class="xp-bar"><div class="xp-fill" id="ui-xp-fill"></div></div>
          <span class="rate" id="ui-xp">0 / 20</span>
        </div>
        <div class="resource">
          <span class="label">Strike Power</span>
          <span class="value" id="ui-power">1</span>
          <span class="rate">per click · Space to hit</span>
        </div>
        <div class="resource">
          <span class="label">Race</span>
          <span class="value" id="ui-race">—</span>
          <button class="link-btn" id="reroll-race">reroll</button>
        </div>
        <div class="resource">
          <span class="label">Sailing</span>
          <span class="value" id="ui-island">—</span>
          <span class="rate">change in Islands tab</span>
        </div>
      </section>

      <!-- Game board -->
      <section class="game-board">

        <!-- LEFT: shop -->
        <aside class="game-shop">
          <div class="tabs" id="shop-tabs">
            <button class="tab active" data-tab="crew">Crew</button>
            <button class="tab" data-tab="fruits">Fruits</button>
            <button class="tab" data-tab="swords">Swords</button>
            <button class="tab" data-tab="styles">Styles</button>
            <button class="tab" data-tab="islands">Islands</button>
          </div>
          <div class="tab-panes" id="shop-panes">
            <div class="tab-pane active" id="pane-crew"></div>
            <div class="tab-pane" id="pane-fruits"></div>
            <div class="tab-pane" id="pane-swords"></div>
            <div class="tab-pane" id="pane-styles"></div>
            <div class="tab-pane" id="pane-islands"></div>
          </div>
        </aside>

        <!-- CENTER: arena -->
        <div class="game-arena" id="arena"></div>

        <!-- RIGHT: info -->
        <aside class="game-info">
          <div class="tabs" id="info-tabs">
            <button class="tab active" data-tab="equip">Equipped</button>
            <button class="tab" data-tab="quests">Quests</button>
            <button class="tab" data-tab="stats">Stats</button>
          </div>
          <div class="tab-panes" id="info-panes">
            <div class="tab-pane active" id="pane-equip"></div>
            <div class="tab-pane" id="pane-quests"></div>
            <div class="tab-pane" id="pane-stats"></div>
          </div>
        </aside>

      </section>

      <!-- Controls -->
      <section class="game-bottombar">
        <span>Auto-saves every 5s · Press <kbd style="font-family:var(--font-mono);padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid var(--border-soft)">Space</kbd> to strike · <kbd style="font-family:var(--font-mono);padding:1px 6px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid var(--border-soft)">/</kbd> to search the wiki</span>
        <div class="actions">
          <a class="btn-sm" href="fruits.html">Wiki: Fruits</a>
          <a class="btn-sm" href="bosses.html">Wiki: Bosses</a>
          <button class="btn-sm prestige" id="prestige-btn">Awaken (prestige)</button>
          <button class="btn-sm danger" id="reset-btn">Hard reset</button>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="assets/js/game.js"></script>
</body>
</html>
