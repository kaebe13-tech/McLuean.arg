<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Update Log — Sailor Piece Wiki</title>
  <meta name="description" content="Every Sailor Piece patch — buffs, nerfs, content drops, and quality-of-life changes." />
  <meta name="theme-color" content="#04091a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23f5c542'/><text x='50%25' y='56%25' text-anchor='middle' font-family='Georgia' font-weight='700' font-size='28' fill='%231a1206'>SP</text></svg>" />
</head>
<body data-page="updates">
  <main>
    <section class="section" style="padding-top: clamp(48px, 8vw, 80px)">
      <div class="container">
        <span class="eyebrow">Patch History</span>
        <div class="section-head">
          <div>
            <h1 style="margin-top:8px">Update Log</h1>
            <p>Every major update, ordered newest first. Tags: <span class="badge badge-tier" style="font-family:var(--font-mono)">Major</span> <span class="badge badge-type">Content</span> <span class="badge badge-rarity" data-rarity="Uncommon">QoL</span> <span class="badge badge-rarity" data-rarity="Mythical">Event</span></p>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { renderUpdates } from './assets/js/data.js';
    document.addEventListener('DOMContentLoaded', () => renderUpdates('data/updates.json'));
  </script>
</body>
</html>
